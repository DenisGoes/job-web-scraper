name: Keep Render API Alive

on:
  schedule:
    # Roda a cada 10 minutos para evitar cold start no Render (limite de 15 min)
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz no Render
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.WEBHOOK_URL }}/healthz")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Aviso: API retornou status $STATUS (pode estar acordando)."
          fi