name: Keep Render API Alive

on:
  schedule:
    # Roda a cada 10 minutos para evitar cold start no Render (limite de 15 min)
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping /healthz no Render
        env:
          BASE_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          CLEAN_URL="${BASE_URL%/webhook}"
          CLEAN_URL="${CLEAN_URL%/}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${CLEAN_URL}/healthz")
          echo "URL chamada: ${CLEAN_URL}/healthz | HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Aviso: API retornou status $STATUS (pode estar acordando)."
          fi