name: Scraper Vagas

on:
  schedule:
    - cron: "17 11,15,19 * * *" # 08:17, 12:17 e 16:17 no horário de Brasília
  workflow_dispatch:

jobs:
  infojobs:
    name: Scraper InfoJobs
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium do Playwright
        run: |
          playwright install chromium --with-deps

      - name: Executar scraper InfoJobs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          CANAL_ID: ${{ secrets.CANAL_ID }}
          INFOJOBS_LOG: ${{ secrets.INFOJOBS_LOG }}
          TOKEN_TELEGRAM_ANALISE: ${{ secrets.TOKEN_TELEGRAM_ANALISE }}
          CANAL_ID_ANALISE: ${{ secrets.CANAL_ID_ANALISE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m app.jobs.job_infojobs

  linkedin:
    name: Scraper LinkedIn
    needs: infojobs
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium do Playwright
        run: |
          playwright install chromium --with-deps

      - name: Executar scraper LinkedIn
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          CANAL_ID: ${{ secrets.CANAL_ID }}
          LINKEDIN_LOG: ${{ secrets.LINKEDIN_LOG }}
          TOKEN_TELEGRAM_ANALISE: ${{ secrets.TOKEN_TELEGRAM_ANALISE }}
          CANAL_ID_ANALISE: ${{ secrets.CANAL_ID_ANALISE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u -m app.jobs.job_linkedin

  bradesco:
    name: Scraper Bradesco
    needs: linkedin
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium do Playwright
        run: |
          playwright install chromium --with-deps

      - name: Executar scraper Bradesco
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          CANAL_ID: ${{ secrets.CANAL_ID }}
          TOKEN_TELEGRAM_ANALISE: ${{ secrets.TOKEN_TELEGRAM_ANALISE }}
          CANAL_ID_ANALISE: ${{ secrets.CANAL_ID_ANALISE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m app.jobs.job_bradesco

  itau:
    name: Scraper Itaú
    needs: bradesco
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium do Playwright
        run: |
          playwright install chromium --with-deps

      - name: Executar scraper Itaú
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          CANAL_ID: ${{ secrets.CANAL_ID }}
          TOKEN_TELEGRAM_ANALISE: ${{ secrets.TOKEN_TELEGRAM_ANALISE }}
          CANAL_ID_ANALISE: ${{ secrets.CANAL_ID_ANALISE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m app.jobs.job_itau

  santander:
    name: Scraper Santander
    needs: itau
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium do Playwright
        run: |
          playwright install chromium --with-deps

      - name: Executar scraper Santander
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          CANAL_ID: ${{ secrets.CANAL_ID }}
          TOKEN_TELEGRAM_ANALISE: ${{ secrets.TOKEN_TELEGRAM_ANALISE }}
          CANAL_ID_ANALISE: ${{ secrets.CANAL_ID_ANALISE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m app.jobs.job_santander
