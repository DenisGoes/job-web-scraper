name: Scraper Vagas

on:
  schedule:
    - cron: "0 * * * *" # Executa de hora em hora
  workflow_dispatch:

jobs:
  infojobs:
    name: Scraper InfoJobs
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium do Playwright
        run: |
          playwright install chromium --with-deps

      - name: Executar scraper InfoJobs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          CANAL_ID: ${{ secrets.CANAL_ID }}
          INFOJOBS_LOG: ${{ secrets.INFOJOBS_LOG }}
        run: python -m backend.scripts.run_infojobs

