- name: Restaurar arquivos de sessão (LinkedIn e InfoJobs)
        env:
          RAW_LINKEDIN_LOG: ${{ secrets.LINKEDIN_LOG }}
          RAW_INFOJOBS_LOG: ${{ secrets.INFOJOBS_LOG }}
        run: |
          python - << 'EOF'
          import base64, json, os

          def restaurar(env_name, target_file):
              raw = (os.environ.get(env_name) or "").strip()
              if not raw:
                  print(f"Aviso: secret {env_name} está vazio.")
                  return
              # Tenta decodificar Base64 se não começar com '{'
              if not raw.startswith("{"):
                  try:
                      raw = base64.b64decode(raw).decode("utf-8")
                  except Exception as e:
                      raise RuntimeError(f"Falha ao decodificar Base64 de {env_name}: {e}")
              # Valida se é um JSON válido antes de salvar
              json.loads(raw)
              with open(target_file, "w", encoding="utf-8") as f:
                  f.write(raw)
              print(f"Arquivo {target_file} restaurado e validado com sucesso.")

          restaurar("RAW_LINKEDIN_LOG", "linkedin_log.json")
          restaurar("RAW_INFOJOBS_LOG", "infojobslog.json")
          EOF
          echo "LINKEDIN_LOG=linkedin_log.json" >> "$GITHUB_ENV"
          echo "INFOJOBS_LOG=infojobslog.json" >> "$GITHUB_ENV"